---
name: Feature request / Enhancement
description: Suggest a new feature or improvement to existing behavior
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution. Requests focused on a real pain point are much easier to evaluate.

  - type: dropdown
    id: area
    attributes:
      label: Which part of CSC does this affect?
      options:
        - Website (playcsc.com)
        - Stats page (stats.playcsc.com)
        - Discord bot
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or pain point. What can't you do today, or what is annoying?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the desired behavior. Be as specific as you can.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      multiple: true
      options:
        - All players
        - Team captains
        - Franchise managers
        - League admins
        - Spectators / fans
        - Everyone

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Are there workarounds today? Why aren't they good enough?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples from other leagues, or anything else that helps.
